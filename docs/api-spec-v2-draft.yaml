        - type
        - count
      properties:
        key:
          $ref: "#/components/schemas/DimensionId"
        label:
          type: string
        type:
          type: string
          enum:
            - Boolean
        count:
          type: integer
          minimum: 0
          description: Vehicles where this flag is true
    FilterOption:
      type: object
      required:
        - value
        - count
      properties:
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        label:
          type: string
          description: Display label if different from value
        count:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Rendering hints (e.g. hex color code, swatch image URL)
    PageSource:
      type: string
      enum:
        - LandingPage
        - WelcomeBack
        - ConversationalSearch
        - Srp
        - Vdp
        - Comparison
        - Recommendations
        - Watchlist
    VisitorLocation:
      type: object
      required:
        - zipCode
        - latitude
        - longitude
      properties:
        zipCode:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: US state code (uppercase, 2 chars)
        country:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    UtmParams:
      type: object
      properties:
        source:
          type: string
          maxLength: 255
        medium:
          type: string
          maxLength: 255
        campaign:
          type: string
          maxLength: 255
        term:
          type: string
          maxLength: 255
        content:
          type: string
          maxLength: 255
    WatchlistVehicle:
      type: object
      required:
        - vin
        - title
        - vehicleId
        - price
        - createdAt
        - updatedAt
        - lastActiveAt
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
        vehicleId:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 255
          description: Display title (e.g. "2025 Toyota RAV4 Hybrid XLE")
        price:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the vehicle was first added to the watchlist.
        updatedAt:
          type: string
          format: date-time
          description: When the watchlist entry was last written (created or overridden).
        lastActiveAt:
          type: string
          format: date-time
          description: Updated on every write to the watchlist entry.
    AddToWatchlistRequest:
      type: object
      required:
        - vin
        - title
        - vehicleId
        - price
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
          description: VIN of the vehicle to add.
        vehicleId:
          type: string
          maxLength: 50
          description: Vehicle identifier supplied by the client.
        title:
          type: string
          maxLength: 255
          description: Display title (e.g. "2025 Toyota RAV4 Hybrid XLE").
        price:
          type: number
          minimum: 0
          description: Vehicle price supplied by the client.
    WatchlistResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistVehicle"
        meta:
          $ref: "#/components/schemas/Meta"
    SearchSession:
      type: object
      required:
        - searchId
        - isSaved
      properties:
        searchId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          description: Custom label for saved searches (e.g. "SUVs under $35k")
        query:
          type: string
          maxLength: 500
          description: Original search query text
        filters:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FilterEntry"
        isSaved:
          type: boolean
          description: Whether this search is pinned (saved) by the visitor
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
    UpdateSearchRequest:
      type: object
      description: |
        Partial update — only provided fields are changed.
        Set isSaved to pin/unpin; set name to rename.
      properties:
        isSaved:
          type: boolean
          description: Pin (true) or unpin (false) the search
        name:
          type: string
          maxLength: 200
          description: Custom label for the saved search
    SearchesResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchSession"
        meta:
          $ref: "#/components/schemas/Meta"
    SearchSessionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/SearchSession"
        meta:
          $ref: "#/components/schemas/Meta"
    DeviceSummary:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - Ok
            - Degraded
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum:
            - Ok
            - Error
        dynamodb:
          type: string
          enum:
            - Ok
            - Error
        redis:
          type: string
          enum:
            - Ok
            - Error
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
