      enum:
        - make
        - model
        - trim
        - bodyStyle
        - fuelType
        - drivetrain
        - transmissionType
        - exteriorColorFamily
        - interiorColorFamily
        - seatingCapacity
        - price
        - mileage
        - year
        - features
        - certified
        - condition
        - vehicleStatus
        - dealerId
        - daysInStock
        - powertrainType
        - vehicleCategory
        - dealRating
        - fuelEfficient
        - isLowMiles
        - familyFriendly
        - hasThirdRow
        - offRoadCapable
        - towingCapable
        - isLuxury
        - isSporty
        - isCityFriendly
        - availability
    FilterKey:
      deprecated: true
      description: "**Deprecated.** Use `DimensionId`. Alias for v1 migration."
      allOf:
        - $ref: "#/components/schemas/DimensionId"
    FilterEntry:
      type: object
      required:
        - key
        - filterType
      properties:
        key:
          $ref: "#/components/schemas/DimensionId"
        filterType:
          type: string
          enum:
            - Enum
            - MultiEnum
            - Range
            - Boolean
          description: Type of filter control (from search API SmartFilter type)
        value:
          description: Selected value (Enum filters — single select)
          oneOf:
            - type: string
            - type: number
            - type: boolean
        values:
          type: array
          maxItems: 50
          items:
            oneOf:
              - type: string
              - type: number
          description: Selected values (MultiEnum filters — multi select)
        min:
          type: number
          description: Range minimum (Range filters)
        max:
          type: number
          description: Range maximum (Range filters)
        enabled:
          type: boolean
          description: Toggle state (Boolean filters — true when active)
    SmartFilter:
      type: object
      required:
        - key
        - label
        - type
      description: |
        One filter dimension with its available values/range in the current
        search context. Shape of additional fields depends on `type`.
      discriminator:
        propertyName: type
        mapping:
          Enum: "#/components/schemas/EnumFilter"
          MultiEnum: "#/components/schemas/MultiEnumFilter"
          Range: "#/components/schemas/RangeFilter"
          Boolean: "#/components/schemas/BooleanFilter"
      oneOf:
        - $ref: "#/components/schemas/EnumFilter"
        - $ref: "#/components/schemas/MultiEnumFilter"
        - $ref: "#/components/schemas/RangeFilter"
        - $ref: "#/components/schemas/BooleanFilter"
