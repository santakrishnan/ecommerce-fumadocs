        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 204  | Passkey successfully deleted. No response body. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 403  | Session present but no authenticated principal is bound. |
        | 404  | No passkey found for the given `authentication-method-id`. |
