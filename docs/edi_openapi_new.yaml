        contentHandling: CONVERT_TO_TEXT

    delete:
      tags:
        - Passkeys
      summary: Clear all passkeys for the current user
      description: |
        Removes all passkey registrations from the identity provider for the currently
        authenticated user. This covers both native passkey credentials and Guardian
        WebAuthn MFA authenticators.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint when the user wants to reset their
          passkey enrollment (for example, after a device loss).
        - After a successful delete, the next ACR-3 authentication attempt for this user
          will trigger a fresh passkey enrollment flow.
        - The `edi-session-id` continuity cookie identifies the session; the gateway
          resolves and injects the principal subject from the session context.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | All passkeys successfully deleted. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 403  | Session present but no authenticated principal is bound. |
        | 500  | Identity provider or configuration issue. |
      operationId: clearPasskeys
