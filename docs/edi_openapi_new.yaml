components:

  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
    session-token-authorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: request
        authorizerUri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gtwy-edi-agdipk-dev-agdipk/invocations"
        authorizerResultTtlInSeconds: 0

  parameters:
    ApiVersion:
      name: x-api-version
      in: header
      required: true
      description: API version identifier.
      schema:
        type: string
        enum:
          - v1
        default: v1
      example: v1

    IdentityProfileId:
      name: identity-profile-id
      in: path
      required: true
      description: The unique identity profile identifier.
      schema:
        type: string
        minLength: 1

    AuthenticationMethodId:
      name: authentication-method-id
      in: path
      required: true
      description: |
        The authentication method identifier for the passkey to delete.
        Obtain this value from the `id` field of a credential or authenticator
        returned by `GET /passkeys`.
      schema:
        type: string
        minLength: 1
      example: "passkey|abc123"

  schemas:
    PasswordlessIdentityChannel:
      type: string
      description: The delivery channel for the one-time password.
      enum:
        - EMAIL
        - SMS
      example: EMAIL

    StartPasswordlessIdentityRequest:
      type: object
      description: Request to initiate a passwordless OTP flow.
      additionalProperties: false
      required:
        - channel
        - recipient
      properties:
        channel:
          $ref: '#/components/schemas/PasswordlessIdentityChannel'
        recipient:
          type: string
          minLength: 1
          description: |
            The email address or phone number to receive the OTP.
            - SMS: must be E.164 format (e.g., +15550001234). Regex: ^\+[0-9]{1,15}$
            - EMAIL: must be a valid email address (local-part@domain, local ≤64 chars, domain ≤255 chars).
          example: "user@example.com"

    VerifyPasswordlessIdentityRequest:
      type: object
      description: Request to verify a passwordless OTP.
      additionalProperties: false
      required:
        - channel
        - recipient
        - otp
      properties:
        channel:
          $ref: '#/components/schemas/PasswordlessIdentityChannel'
        recipient:
          type: string
          minLength: 1
          description: |
            The email address or phone number to receive the OTP.
            - SMS: must be E.164 format (e.g., +15550001234). Regex: ^\+[0-9]{1,15}$
            - EMAIL: must be a valid email address (local-part@domain, local ≤64 chars, domain ≤255 chars).
          example: "user@example.com"
        otp:
          type: string
          minLength: 1
          description: The one-time password submitted by the user for verification.
          example: "123456"

    PasskeyRegistrationStartRequest:
      type: object
      description: Request to begin a passkey enrollment ceremony for the current session.
      additionalProperties: false
      required:
        - userProfile
      properties:
        userProfile:
          $ref: '#/components/schemas/PasskeyUserProfile'

    PasskeyUserProfile:
      type: object
      description: |
        Optional user details supplied by the browser to help populate the enrollment experience.
        The object itself is required for the public API contract even when only one identifier is known.
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Email address associated with the enrolling user.
          example: "new.user@example.com"
        phoneNumber:
          type: string
          description: Phone number associated with the enrolling user in E.164 format.
          pattern: '^\+[0-9]{1,15}$'
          example: "+15550001234"
        name:
          type: string
          minLength: 1
          description: Human-readable display name for the enrolling user.
          example: "New User"

    PasskeyRegistrationStartResponse:
      type: object
      description: Response containing WebAuthn credential creation options for passkey enrollment.
      required:
        - authnParamsPublicKey
        - authSession
      properties:
        authnParamsPublicKey:
          $ref: '#/components/schemas/PasskeyCredentialCreationOptions'
        authSession:
          type: string
          minLength: 1
          description: Opaque Auth0 passkey enrollment session that must be echoed to registration completion.
          example: "auth-session-1"
        authenticationMethodId:
          type: string
          nullable: true
          description: Optional authentication method identifier returned by the identity provider.
          example: "passkey|new"

    PasskeyRegistrationCompleteRequest:
      type: object
      description: Request to complete passkey enrollment after browser credential creation.
      additionalProperties: false
      required:
        - authSession
        - authnResponse
      properties:
        authSession:
          type: string
          minLength: 1
          description: Opaque passkey enrollment session returned by passkey-registration start.
          example: "auth-session-1"
        authnResponse:
          allOf:
            - $ref: '#/components/schemas/PasskeyAttestationResponse'
          description: |
            WebAuthn attestation payload produced by `navigator.credentials.create()`
            and serialized by the client before calling this endpoint.

    PasskeyAttestationResponse:
      type: object
      description: |
        Browser-generated WebAuthn credential attestation payload returned from
        `navigator.credentials.create()` after base64url serialization.
      additionalProperties: true
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
          minLength: 1
          description: Browser credential identifier.
          example: "cred-1"
        rawId:
          type: string
          minLength: 1
          description: Base64url-encoded raw credential identifier.
          example: "BwgJ"
        type:
          type: string
          minLength: 1
          description: Public key credential type.
          example: "public-key"
        authenticatorAttachment:
          type: string
          nullable: true
          description: Authenticator attachment reported by the browser, when available.
          example: "platform"
        response:
          $ref: '#/components/schemas/PasskeyAttestationResponseBody'
        clientExtensionResults:
          type: object
          description: Browser-reported WebAuthn client extension results.
          additionalProperties: true
          example: {}

    PasskeyAttestationResponseBody:
      type: object
      description: Serialized WebAuthn attestation response body.
      additionalProperties: true
      required:
        - clientDataJSON
        - attestationObject
      properties:
        clientDataJSON:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn client data JSON.
          example: "CgsM"
        attestationObject:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn attestation object.
          example: "DQ4P"

    PasskeyRegistrationCompleteResponse:
      type: object
      description: Response confirming that passkey enrollment verification completed successfully.
      required:
        - verified
        - identity
        - profile
        - sessionTokenBound
        - verifyResponse
      properties:
        verified:
          type: boolean
          description: Indicates whether the passkey enrollment verification succeeded.
          example: true
        identity:
          $ref: '#/components/schemas/PasskeyVerifiedIdentity'
        profile:
          $ref: '#/components/schemas/PasskeyClaimedProfile'
        sessionTokenBound:
          type: boolean
          description: |
            Indicates whether a new session-token binding occurred during completion.
            For passkey registration completion this is currently `false`.
          example: false
        expiresIn:
          type: integer
          format: int64
          nullable: true
          description: |
            Token expiration time in seconds when a token exchange occurs.
            This is currently `null` for passkey registration completion.
          example: null
        scope:
          type: string
          nullable: true
          description: |
            Authentication scope returned when a token exchange occurs.
            This is currently `null` for passkey registration completion.
          example: null
        verifyResponse:
          type: object
          description: Provider-defined verification response returned by the upstream identity service.
          additionalProperties: true
          example: {}

    PasskeyVerifiedIdentity:
      type: object
      description: Identity details bound to the passkey-enrolled session.
      required:
        - principalSubject
      properties:
        principalSubject:
          type: string
          minLength: 1
          description: Canonical subject identifier for the authenticated principal.
          example: "auth0|new-user"
        email:
          type: string
          format: email
          nullable: true
          description: Email address for the verified principal, when available.
          example: "new.user@example.com"
        emailVerified:
          type: boolean
          nullable: true
          description: Whether the email address has been verified.
          example: true
        phoneNumber:
          type: string
          nullable: true
          description: Phone number for the verified principal, when available.
          example: "+15550001234"
        phoneNumberVerified:
          type: boolean
          nullable: true
          description: Whether the phone number has been verified.
          example: true
        acr:
          type: string
          nullable: true
          description: Current authentication context class reference carried with the session.
          example: "urn:toyota:acr:1fa:otp"
        acrLevel:
          type: integer
          nullable: true
          description: Numeric interpretation of the current ACR, when available.
          example: 1

    PasskeyClaimedProfile:
      type: object
      description: Identity profile claim result after successful passkey enrollment.
      required:
        - identityProfileId
        - principalSubject
      properties:
        identityProfileId:
          type: string
          minLength: 1
          description: Durable identity profile identifier associated with the current session.
          example: "ip_passkey"
        principalSubject:
          type: string
          minLength: 1
          description: Principal subject bound to the returned identity profile.
          example: "auth0|new-user"
        principalBoundAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the principal binding was established on the profile.
          example: "2026-07-30T15:10:09Z"
        previousPrincipalSubject:
          type: string
          nullable: true
          description: Previously bound principal subject, if one was replaced.
          example: "sms|e164:+15551234567"


    PasskeyAuthenticationStartResponse:
      type: object
      description: Response containing WebAuthn credential request options for passkey assertion.
      required:
        - authnParamsPublicKey
        - authSession
      properties:
        authnParamsPublicKey:
          type: object
          description: |
            WebAuthn credential request (assertion) options returned by the identity provider.
            This is the object to pass to `navigator.credentials.get()` after wrapping it in a
            `publicKey` property. Additional WebAuthn fields may be present.
          additionalProperties: true
          example:
            challenge: "AQID"
            rpId: "example.com"
            allowCredentials: []
            timeout: 60000
        authSession:
          type: string
          minLength: 1
          description: Opaque Auth0 passkey challenge session that must be echoed to authentication completion.
          example: "auth-session-2"

    PasskeyAuthenticationCompleteRequest:
      type: object
      description: Request to complete passkey authentication after the browser generates an assertion.
      additionalProperties: false
      required:
        - authSession
        - authnResponse
      properties:
        authSession:
          type: string
          minLength: 1
          description: Opaque passkey challenge session returned by passkey-authentication start.
          example: "auth-session-2"
        authnResponse:
          allOf:
            - $ref: '#/components/schemas/PasskeyAssertionResponse'
          description: |
            WebAuthn assertion payload produced by `navigator.credentials.get()`
            and serialized by the client before calling this endpoint.
        audience:
          type: string
          minLength: 1
          description: |
            Optional OAuth 2.0 audience override for the token exchange.
            When omitted, `token-service` derives the audience from its configured issuer base URL.
          example: "https://api.example.com"

    PasskeyAssertionResponse:
      type: object
      description: |
        Browser-generated WebAuthn credential assertion payload returned from
        `navigator.credentials.get()` after base64url serialization.
      additionalProperties: true
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
          minLength: 1
          description: Credential identifier selected by the browser.
          example: "cred-1"
        rawId:
          type: string
          minLength: 1
          description: Base64url-encoded raw credential identifier.
          example: "BwgJ"
        type:
          type: string
          minLength: 1
          description: Public key credential type.
          example: "public-key"
        authenticatorAttachment:
          type: string
          nullable: true
          description: Authenticator attachment reported by the browser, when available.
          example: "platform"
        response:
          $ref: '#/components/schemas/PasskeyAssertionResponseBody'
        clientExtensionResults:
          type: object
          description: Browser-reported WebAuthn client extension results.
          additionalProperties: true
          example: {}

    PasskeyAssertionResponseBody:
      type: object
      description: Serialized WebAuthn assertion response body.
      additionalProperties: true
      required:
        - clientDataJSON
        - authenticatorData
        - signature
      properties:
        clientDataJSON:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn client data JSON.
          example: "CgsM"
        authenticatorData:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn authenticator data.
          example: "DQOP"
        signature:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn assertion signature.
          example: "ERQT"
        userHandle:
          type: string
          nullable: true
          description: Base64url-encoded user handle returned by the authenticator, when present.
          example: "BAUG"

    PasskeyAuthenticationCompleteResponse:
      type: object
      description: Response confirming that passkey assertion verification completed successfully.
      required:
        - verified
        - identity
        - profile
        - verifyResponse
      properties:
        verified:
          type: boolean
          description: Indicates whether the passkey assertion verification succeeded.
          example: true
        identity:
          $ref: '#/components/schemas/PasskeyVerifiedIdentity'
        profile:
          $ref: '#/components/schemas/PasskeyClaimedProfile'
        verifyResponse:
          type: object
          description: |
            Provider-defined verification response with sensitive token fields
            (access_token, id_token, refresh_token) redacted. Stored server-side only.
          additionalProperties: true
          example: {}

    ListPasskeysResponse:
      type: object
      description: All passkey registrations on file for the authenticated user.
      required:
        - credentials
        - authenticators
      properties:
        credentials:
          type: array
          description: |
            Native passkey credentials registered via Auth0's Passkeys feature.
          items:
            $ref: '#/components/schemas/PasskeyCredentialEntry'
        authenticators:
          type: array
          description: |
            Guardian WebAuthn MFA authenticators registered via the older
            WebAuthn/Guardian flow.
          items:
            $ref: '#/components/schemas/PasskeyAuthenticatorEntry'

    PasskeyCredentialEntry:
      type: object
      description: Native passkey credential record from the identity provider.
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
          description: Unique credential identifier.
          example: "cred-abc123"
        credentialType:
          type: string
          nullable: true
          description: Type of credential.
          example: "public-key"
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the credential was created.
          example: "2026-07-30T14:50:00Z"
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the credential was last used.
          example: "2026-07-30T15:10:09Z"
        userAgent:
          type: string
          nullable: true
          description: User-agent string of the browser or device that registered the credential.
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"

    PasskeyAuthenticatorEntry:
      type: object
      description: Guardian WebAuthn MFA authenticator record from the identity provider.
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
          description: Unique authenticator identifier.
          example: "auth-def456"
        authenticatorType:
          type: string
          nullable: true
          description: Authenticator type.
          example: "webauthn-roaming"
        active:
          type: boolean
          nullable: true
          description: Whether the authenticator is currently active.
          example: true
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the authenticator was registered.
          example: "2026-07-30T14:50:00Z"
        lastAuthAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the authenticator was last used for authentication.
          example: "2026-07-30T15:10:09Z"

    ClearPasskeysResponse:
      type: object
      description: Result of a passkey reset operation.
      required:
        - deleted
      properties:
        deleted:
          type: integer
          description: Total number of passkey registrations deleted across both credential and authenticator stores.
          example: 2

    PasskeyCredentialCreationOptions:
      type: object
      description: |
        WebAuthn credential creation options returned by the identity provider.
        This schema documents the commonly used fields and allows additional WebAuthn
        properties to preserve forward compatibility.
      additionalProperties: true
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      properties:
        challenge:
          type: string
          minLength: 1
          description: Base64url-encoded WebAuthn challenge.
          example: "AQID"
        rp:
          $ref: '#/components/schemas/PasskeyRelyingParty'
        user:
          $ref: '#/components/schemas/PasskeyCredentialUser'
        pubKeyCredParams:
          type: array
          description: Acceptable public-key credential algorithms for the passkey ceremony.
          items:
            $ref: '#/components/schemas/PasskeyPublicKeyCredentialParameter'

    PasskeyRelyingParty:
      type: object
      additionalProperties: true
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 1
          description: WebAuthn relying party identifier.
          example: "example.com"
        name:
          type: string
          minLength: 1
          description: Human-readable relying party name.
          example: "example.com"

    PasskeyCredentialUser:
      type: object
      additionalProperties: true
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 1
          description: Base64url-encoded user handle for WebAuthn registration.
          example: "BAUG"
        name:
          type: string
          minLength: 1
          description: User identifier shown to the authenticator platform.
          example: "new.user@example.com"
        displayName:
          type: string
          minLength: 1
          description: Human-readable display name shown during passkey creation.
          example: "New User"

    PasskeyPublicKeyCredentialParameter:
      type: object
      additionalProperties: true
      required:
        - type
        - alg
      properties:
        type:
          type: string
          description: Public key credential type.
          example: "public-key"
        alg:
          type: integer
          description: COSE algorithm identifier.
          example: -7

    # ── Response bodies ──────────────────────────────────────────────────────
    StartPasswordlessIdentityResponse:
      type: object
      description: Response confirming the OTP was sent to the recipient.
      required:
        - started
        - channel
        - recipient
      properties:
        started:
          type: boolean
          description: Indicates whether the OTP was successfully sent.
          example: true
        channel:
          $ref: '#/components/schemas/PasswordlessIdentityChannel'
        recipient:
          type: string
          description: The normalized recipient that the OTP was sent to.
          example: "user@example.com"
        message:
          type: string
          description: A human-readable status message.
          example: "OTP sent."

    VerifyPasswordlessIdentityResponse:
      type: object
      description: Response confirming the OTP was successfully verified.
      required:
        - verified
        - expiresIn
        - identity
        - profile
        - verifyResponse
      properties:
        verified:
          type: boolean
          description: Indicates whether the OTP was successfully verified.
          example: true
        expiresIn:
          type: integer
          format: int64
          description: Token expiration time in seconds.
          example: 86400
        scope:
          type: string
          nullable: true
          description: The authentication scope granted upon successful verification.
          example: "openid profile"
        identity:
          $ref: '#/components/schemas/PasskeyVerifiedIdentity'
        profile:
          $ref: '#/components/schemas/PasskeyClaimedProfile'
        verifyResponse:
          type: object
          description: Provider-defined verification response (sensitive token fields redacted).
          additionalProperties: true
          example: { }

    IdentityProfileResponse:
      type: object
      description: Identity profile representation.
      required:
        - identityProfileId
        - deviceHashes
        - identities
        - createdAt
        - updatedAt
      properties:
        identityProfileId:
          type: string
          description: Durable identity profile identifier.
          example: "ip_3833ee06b9ab40a388c8ef5164852dcb"
        principalSubject:
          type: string
          nullable: true
          description: Current primary principal bound to the profile.
          example: "auth0|abc123"
        principalBoundAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the principal was bound.
          example: "2026-07-30T15:10:09Z"
        previousPrincipalSubject:
          type: string
          nullable: true
          description: Previously bound principal subject, if available.
          example: "sms|e164:+15551234567"
        deviceHashes:
          type: array
          items:
            $ref: '#/components/schemas/DeviceHashResponse'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/IdentityResponse'
        createdAt:
          type: string
          format: date-time
          example: "2026-07-30T14:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-30T15:10:09Z"

    DeviceHashResponse:
      type: object
      description: Device hash linked to the identity profile.
      required:
        - deviceHash
        - source
        - associatedAt
      properties:
        deviceHash:
          type: string
          example: "fp_x7y8z9w0"
        source:
          type: string
          enum:
            - FINGERPRINT_WEBHOOK
            - RECOVERY_CHECK
            - AUTHENTICATION_DEVICE
            - INTERNAL
          example: "AUTHENTICATION_DEVICE"
        associatedAt:
          type: string
          format: date-time
          example: "2026-07-30T15:08:00Z"

    IdentityResponse:
      type: object
      description: Identity record linked to the identity profile.
      required:
        - provider
        - connection
        - subject
        - providerUserId
        - recipientNormalized
        - primary
      properties:
        provider:
          type: string
          example: "auth0"
        connection:
          type: string
          example: "Username-Password-Authentication"
        subject:
          type: string
          example: "auth0|abc123"
        providerUserId:
          type: string
          example: "auth0|abc123"
        recipientNormalized:
          type: string
          example: "user@example.com"
        primary:
          type: boolean
          example: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-30T15:10:09Z"
        linkedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-30T15:10:09Z"

    # ── Error shapes ─────────────────────────────────────────────────────────
    EdiErrorCode:
      type: string
      description: |
        A structured error code following the format `EDI-{SERVICE}-{NUMBER}`.
        - `EDI` identifies the Enterprise Digital Identity platform.
        - `TES` identifies the Token Exchange Service microservice.
        - The numeric portion (001–999) identifies the specific error.
      pattern: '^EDI-TES-\d{3}$'
      example: "EDI-TES-100"

    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details for HTTP APIs. Base error shape used for all
        error responses.
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI linking to the EDI error code documentation section for this problem type.
          example: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: "Bad Request"
        status:
          type: integer
          description: The HTTP status code.
          example: 400
        detail:
          type: string
          description: A generic, consumer-safe message describing the error. Intentionally non-specific to avoid leaking internal details.
          example: "Invalid request."
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence.
          example: "/passwordless/start"

    PasswordlessIdentityErrorResponse:
      description: |
        Error response returned when a passwordless identity operation fails.
        Extends RFC 9457 `ProblemDetail` with the `ediErrorCode` field for
        machine-readable error identification. The `type` field (from ProblemDetail)
        links to the EDI error code documentation.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required:
            - ediErrorCode
            - type
          properties:
            ediErrorCode:
              $ref: '#/components/schemas/EdiErrorCode'

  # ── Reusable responses ─────────────────────────────────────────────────────
  responses:

    Unauthorized:
      description: |
        Caller is not authenticated or bearer token is invalid/expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-300"
            title: "Unauthorized"
            status: 401
            detail: "Bearer token is missing, invalid, or expired."
            ediErrorCode: "EDI-TES-300"

    Forbidden:
      description: |
        Caller is authenticated but does not have permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-301"
            title: "Forbidden"
            status: 403
            detail: "This service does not have permission to access passwordless identity operations."
            ediErrorCode: "EDI-TES-301"

    InternalServerError:
      description: |
        An identity provider or configuration issue occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          examples:
            defaultError:
              summary: Uncategorized error
              value:
                type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-200"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected error occurred."
                instance: "/passwordless/start"
                ediErrorCode: "EDI-TES-200"
            configurationError:
              summary: Identity provider configuration error
              value:
                type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-201"
                title: "Internal Server Error"
                status: 500
                detail: "Identity provider configuration error."
                instance: "/passwordless/start"
                ediErrorCode: "EDI-TES-201"
            connectionError:
              summary: Identity provider connection error
              value:
                type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-202"
                title: "Internal Server Error"
                status: 500
                detail: "Identity provider connection error."
                instance: "/passwordless/start"
                ediErrorCode: "EDI-TES-202"
            serverError:
              summary: Identity provider server error
              value:
                type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-203"
                title: "Internal Server Error"
                status: 500
                detail: "Identity provider server error."
                instance: "/passwordless/start"
                ediErrorCode: "EDI-TES-203"

    TooManyRequests:
      description: |
        The identity provider is temporarily unavailable due to rate limiting.
        The caller should retry after a brief delay.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-204"
            title: "Too Many Requests"
            status: 429
            detail: "Service is experiencing rate limiting error. Please try again later."
            ediErrorCode: "EDI-TES-204"

    UnauthorizedIdentityProfile:
      description: |
        Caller is not authenticated or UI session cookie is invalid/expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-300"
            title: "Unauthorized"
            status: 401
            detail: "Session cookie is missing, invalid, or expired."
            ediErrorCode: "EDI-TES-300"

    ForbiddenIdentityProfile:
      description: |
        Caller is authenticated but does not have permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-301"
            title: "Forbidden"
            status: 403
            detail: "This service does not have permission to access identity profile operations."
            ediErrorCode: "EDI-TES-301"

    NotFoundIdentityProfile:
      description: |
        No identity profile was found for the provided session or identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-404"
            title: "Not Found"
            status: 404
            detail: "Identity profile not found."
            ediErrorCode: "EDI-TES-404"

    NotFoundPasskey:
      description: |
        No passkey registration was found for the provided authentication method identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-404"
            title: "Not Found"
            status: 404
            detail: "Passkey not found."
            ediErrorCode: "EDI-TES-404"

    ConflictIdentityProfile:
      description: |
        The request conflicts with current identity profile state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
          example:
            type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-409"
            title: "Conflict"
            status: 409
            detail: "Identity profile state conflict."
            ediErrorCode: "EDI-TES-409"

