openapi: 3.0.1
info:
  title: Enterprise Digital Identity API
  version: v1.0.0
  contact:
    name: Enterprise Digital Identity (EDI)
    email: digital-identity-support@toyota.com
    url: https://go/edi
  description: |
    Provides Digital Identity services including passwordless OTP initiation and verification, and retrieval of an identity in the Enterprise
    Digital Identity (EDI) platform.

    ## Versioning
    All endpoints are versioned via the `x-api-version` request header (e.g. `x-api-version: v1`).

    ## Response format
    - **Success responses (2xx)** use `application/json`.
    - **Error responses (4xx, 5xx)** use `application/problem+json` (RFC 9457),
      extended with `ediErrorCode` for EDI-specific error taxonomy. The `type`
      field links to the relevant EDI error code documentation.

    ## Service port
    Token Exchange Service runs on `:8080` locally.
  x-tfs-product-owner: autumn.rudolph@toyota.com
  x-tfs-tech-lead: sunil.sangole@toyota.com
  x-tfs-gateway-base-path: digital-identity
  x-tfs-default-minimumAcr: 0

servers:
  - url: https://origination-apigw-dev.toyotafintech.io/digital-identity
    description: Development

tags:
  - name: Passwordless OTP Flow
    description: |
      Passwordless OTP lifecycle — initiate and verify one-time passwords via
      email or SMS for the Enterprise Digital Identity platform.
  - name: Passkeys
    description: |
      Passkey enrollment, authentication, and management APIs for browser
      clients using the Enterprise Digital Identity platform.
  - name: Identity Profile
    description: |
      Identity profile retrieval APIs for UI session-based access and
      service-to-service profile reads.

paths:
  /identity/passwordless/start:
    post:
      tags:
        - Passwordless OTP Flow
      summary: Start passwordless OTP
      description: |
        Initiates a passwordless authentication flow by sending a one-time password
        (OTP) to the specified recipient via email or SMS.

        ### When to call this endpoint
        - **token-service** calls this to begin an OTP-based passwordless login.
        - The caller supplies a `channel` (EMAIL or SMS) and a `recipient` (email
          address or phone number).

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | OTP successfully sent to the recipient. |
        | 400  | Bad request — the caller must fix the request (invalid input, malformed body, delivery failure). |
        | 401  | Missing or invalid authentication credentials. |
        | 403  | Caller lacks required permissions. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue. |
      operationId: startPasswordlessIdentity
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPasswordlessIdentityRequest'
      responses:
        '200':
          description: OTP successfully sent to the recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPasswordlessIdentityResponse'
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request (missing field, bad format, unrecognized property)
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passwordless/start"
                    ediErrorCode: "EDI-TES-100"
                deliveryFailure:
                  summary: SMS/Email delivery failure
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-101"
                    title: "Bad Request"
                    status: 400
                    detail: "Identity provider notification delivery failure."
                    instance: "/passwordless/start"
                    ediErrorCode: "EDI-TES-101"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /identity/passwordless/verify:
    post:
      tags:
        - Passwordless OTP Flow
      summary: Verify passwordless OTP
      description: |
        Verifies a one-time password (OTP) submitted by the recipient to complete
        the passwordless authentication flow.

        ### When to call this endpoint
        - **token-service** calls this after the user submits the OTP received via
          email or SMS.
        - On success, the response includes OAuth token metadata (`expiresIn`,
          `scope`) that downstream services use to establish a session.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | OTP successfully verified. |
        | 400  | Bad request — the caller must fix the request (invalid input, malformed body, incorrect OTP). |
        | 401  | Missing or invalid authentication credentials. |
        | 403  | Caller lacks required permissions. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue. |
      operationId: verifyPasswordlessIdentity
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordlessIdentityRequest'
      responses:
        '200':
          description: OTP successfully verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasswordlessIdentityResponse'
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request (missing field, bad format, unrecognized property)
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passwordless/verify"
                    ediErrorCode: "EDI-TES-100"
                verificationFailed:
                  summary: OTP verification failed
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-102"
                    title: "Bad Request"
                    status: 400
                    detail: "Verification failed."
                    instance: "/passwordless/verify"
                    ediErrorCode: "EDI-TES-102"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /passkeys/register:
    post:
      tags:
        - Passkeys
      summary: Start passkey registration
      description: |
        Starts a WebAuthn passkey enrollment ceremony for the current browser session.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint after the user has an existing
          `edi-session-id` continuity cookie and has already completed OTP-based sign-in.
        - The API returns WebAuthn credential creation options in
          `authnParamsPublicKey` plus an opaque `authSession` that the client must
          submit to the registration-complete endpoint.
        - Gateway-trusted identity headers used downstream by `token-service` are internal
          implementation details and are not part of the public client contract.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | Passkey registration challenge successfully created. |
        | 400  | Bad request — malformed body, missing required session context, or OTP re-authentication is required before enrollment. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue prevented registration start. |
      operationId: startPasskeyRegistration
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationStartRequest'
            examples:
              emailEnrollment:
                summary: Start enrollment for a user with email context
                value:
                  userProfile:
                    email: "new.user@example.com"
                    name: "New User"
              smsEnrollment:
                summary: Start enrollment for a user with SMS context
                value:
                  userProfile:
                    phoneNumber: "+15550001234"
                    name: "Jamie Driver"
      responses:
        '200':
          description: Passkey registration challenge successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationStartResponse'
              examples:
                success:
                  value:
                    authnParamsPublicKey:
                      challenge: "AQID"
                      rp:
                        id: "example.com"
                        name: "example.com"
                      user:
                        id: "BAUG"
                        name: "new.user@example.com"
                        displayName: "New User"
                      pubKeyCredParams:
                        - type: "public-key"
                          alg: -7
                    authSession: "auth-session-1"
                    authenticationMethodId: "passkey|new"
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passkeys/register"
                    ediErrorCode: "EDI-TES-100"
                otpChallengeRequired:
                  summary: OTP challenge must be completed before passkey enrollment
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-103"
                    title: "Bad Request"
                    status: 400
                    detail: "Passkey enrollment requires completion of an OTP first."
                    instance: "/passkeys/register"
                    ediErrorCode: "EDI-TES-103"
        '401':
          $ref: '#/components/responses/UnauthorizedIdentityProfile'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /passkeys/register/complete:
    post:
      tags:
        - Passkeys
      summary: Complete passkey registration
      description: |
        Completes a WebAuthn passkey enrollment ceremony for the current browser session.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint after successfully creating a
          WebAuthn credential in the user's browser.
        - The caller sends back the opaque `authSession` from passkey-registration start
          and the browser-generated `authnResponse` payload.
        - `authnResponse` comes from the result of `navigator.credentials.create()`
          (WebAuthn attestation) after the client serializes binary fields to base64url.
        - The only client-facing authentication and authorization input is the
          `edi-session-id` continuity cookie. Any downstream trusted headers used by the
          gateway or `token-service` are internal implementation details.
        - On success, `token-service` verifies the passkey with the identity provider and
          claims or updates the current identity profile. No token refresh/exchange occurs
          during this completion step.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | Passkey registration successfully completed. |
        | 400  | Bad request — malformed body, invalid WebAuthn response, or OTP re-authentication is required before enrollment can complete. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue prevented registration completion. |
      operationId: completePasskeyRegistration
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationCompleteRequest'
            examples:
              browserCompletion:
                summary: Complete passkey enrollment with browser-generated attestation
                value:
                  authSession: "auth-session-1"
                  authnResponse:
                    id: "cred-1"
                    rawId: "BwgJ"
                    type: "public-key"
                    authenticatorAttachment: "platform"
                    response:
                      clientDataJSON: "CgsM"
                      attestationObject: "DQ4P"
                    clientExtensionResults: {}
      responses:
        '200':
          description: Passkey registration successfully completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationCompleteResponse'
              examples:
                success:
                  value:
                    verified: true
                    identity:
                      principalSubject: "auth0|new-user"
                      email: null
                      emailVerified: null
                      phoneNumber: null
                      phoneNumberVerified: null
                      acr: "urn:toyota:acr:1fa:otp"
                      acrLevel: null
                    profile:
                      identityProfileId: "ip_passkey"
                      principalSubject: "auth0|new-user"
                      principalBoundAt: "2026-07-30T15:10:09Z"
                      previousPrincipalSubject: null
                    sessionTokenBound: false
                    expiresIn: null
                    scope: null
                    verifyResponse: {}
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passkeys/register/complete"
                    ediErrorCode: "EDI-TES-100"
                otpChallengeRequired:
                  summary: OTP challenge must be completed before passkey enrollment can complete
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-103"
                    title: "Bad Request"
                    status: 400
                    detail: "Unable to complete passkey enrollment: session has no My Account API token. Complete an OTP challenge first (passwordless start + verify), then retry passkey enrollment."
                    instance: "/passkeys/register/complete"
                    ediErrorCode: "EDI-TES-103"
        '401':
          $ref: '#/components/responses/UnauthorizedIdentityProfile'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /passkeys/authenticate/start:
    post:
      tags:
        - Passkeys
      summary: Start passkey authentication
      description: |
        Starts a WebAuthn passkey assertion ceremony for the current browser session.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint to begin passkey-based sign-in.
        - Unlike passkey registration, an existing authenticated session is **not** required.
          A valid `edi-session-id` continuity cookie is the only client-facing input.
        - The API returns WebAuthn credential request options in `authnParamsPublicKey`
          plus an opaque `authSession` that the client must submit to
          `/passkeys/authenticate/complete`.
        - The challenge request parameters for Auth0 are resolved server-side by
          `token-service`; clients do not provide request-body parameters for this call.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | Passkey authentication challenge successfully created. |
        | 400  | Bad request — malformed body or identity provider rejected the challenge request. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue prevented challenge creation. |
      operationId: startPasskeyAuthentication
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Passkey authentication challenge successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthenticationStartResponse'
              examples:
                success:
                  value:
                    authnParamsPublicKey:
                      challenge: "AQID"
                      rpId: "example.com"
                      allowCredentials: []
                      timeout: 60000
                    authSession: "auth-session-2"
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passkeys/authenticate/start"
                    ediErrorCode: "EDI-TES-100"
        '401':
          $ref: '#/components/responses/UnauthorizedIdentityProfile'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /passkeys/authenticate/complete:
    post:
      tags:
        - Passkeys
      summary: Complete passkey authentication
      description: |
        Completes a WebAuthn passkey assertion ceremony and establishes a fully
        authenticated session for the current browser.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint after the user approves the passkey
          assertion on their device.
        - The caller sends back the opaque `authSession` from passkey-authentication start
          and the browser-generated `authnResponse` assertion payload.
        - `authnResponse` comes from the result of `navigator.credentials.get()`
          (WebAuthn assertion) after the client serializes binary fields to base64url.
        - On success, `token-service` exchanges the WebAuthn grant with the identity
          provider, stores the resulting tokens in the server-side session, and returns
          the resolved identity and profile.
        - Tokens are stored server-side and are **not** returned to the browser.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | Passkey authentication successfully completed. |
        | 400  | Bad request — malformed body or invalid WebAuthn assertion. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 429  | Too many requests — rate limited by the identity provider. |
        | 500  | Identity provider or configuration issue prevented authentication completion. |
      operationId: completePasskeyAuthentication
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAuthenticationCompleteRequest'
            examples:
              browserAssertion:
                summary: Complete authentication with browser-generated assertion
                value:
                  authSession: "auth-session-2"
                  authnResponse:
                    id: "cred-1"
                    rawId: "BwgJ"
                    type: "public-key"
                    authenticatorAttachment: "platform"
                    response:
                      clientDataJSON: "CgsM"
                      authenticatorData: "DQOP"
                      signature: "ERQT"
                      userHandle: "BAUG"
                    clientExtensionResults: {}
      responses:
        '200':
          description: Passkey authentication successfully completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthenticationCompleteResponse'
              examples:
                success:
                  value:
                    verified: true
                    identity:
                      principalSubject: "auth0|existing-user"
                      email: "user@example.com"
                      emailVerified: true
                      phoneNumber: null
                      phoneNumberVerified: null
                      acr: "urn:toyota:acr:2fa:phr"
                      acrLevel: 3
                    profile:
                      identityProfileId: "ip_3833ee06b9ab40a388c8ef5164852dcb"
                      principalSubject: "auth0|existing-user"
                      principalBoundAt: "2026-07-30T15:10:09Z"
                      previousPrincipalSubject: null
                    verifyResponse: {}
        '400':
          description: |
            The request contains invalid or malformed data that must be corrected by the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordlessIdentityErrorResponse'
              examples:
                invalidRequest:
                  summary: Invalid or malformed request
                  value:
                    type: "https://miniature-adventure-yv2q33e.pages.github.io/enterprisedigitalidentity/EDIErrorCodes#EDI-TES-100"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid request."
                    instance: "/passkeys/authenticate/complete"
                    ediErrorCode: "EDI-TES-100"
        '401':
          $ref: '#/components/responses/UnauthorizedIdentityProfile'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - session-token-authorizer: []
        - api-key: []
      x-tfs-configuration:
        tokenAuthRequired: "true"
        visibility: public
        integrationType: http
        httpMethod: POST
        uri: https://diip4d.tmcc-idp-endigy-dev.aws.tfscloud.com/digital-id-profile-service
      x-amazon-apigateway-integration:
        type: aws_proxy
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:402631154341:function:api-gateway-backend-router-lambda-agbrbj-dev-agbrbj/invocations"
        httpMethod: POST
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: when_no_templates
        timeoutInMillis: 29000
        responseTransferMode: BUFFERED
        contentHandling: CONVERT_TO_TEXT

  /passkeys:
    get:
      tags:
        - Passkeys
      summary: List passkeys for the current user
      description: |
        Returns all passkey registrations on file with the identity provider for the
        currently authenticated user.

        ### When to call this endpoint
        - A browser or browser SDK calls this endpoint to display registered passkeys for
          the authenticated principal.
        - The `edi-session-id` continuity cookie identifies the session; the gateway
          resolves and injects the principal subject from the session context.
        - The response covers both native passkey credentials and Guardian WebAuthn MFA
          authenticators stored by the identity provider.

        ### HTTP status codes
        | Code | Meaning |
        |------|---------|
        | 200  | Passkey list successfully retrieved. |
        | 401  | Missing or invalid `edi-session-id` continuity cookie. |
        | 403  | Session present but no authenticated principal is bound. |
        | 500  | Identity provider or configuration issue. |
      operationId: listPasskeys
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Passkey list successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPasskeysResponse'
              examples:
                withPasskeys:
                  summary: User has registered passkeys
                  value:
                    credentials:
                      - id: "cred-abc123"
                        credentialType: "public-key"
                        createdAt: "2026-07-30T14:50:00Z"
                        lastUsedAt: "2026-07-30T15:10:09Z"
                        userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
                    authenticators:
                      - id: "auth-def456"
                        authenticatorType: "webauthn-roaming"
                        active: true
                        createdAt: "2026-07-30T14:50:00Z"
                        lastAuthAt: "2026-07-30T15:10:09Z"
                empty:
                  summary: No passkeys registered for the user
                  value:
                    credentials: []
                    authenticators: []
        '401':
          $ref: '#/components/responses/UnauthorizedIdentityProfile'
        '403':
          $ref: '#/components/responses/ForbiddenIdentityProfile'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
